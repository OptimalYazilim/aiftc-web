# ===========================================================================
# AIFTC — PostgreSQL istemci kimlik doğrulama kuralları
# ===========================================================================
# KURULUMDA YAPILACAK: aşağıdaki WEB_SUNUCU_IP yazısını web sunucusunun
# (webaiftc) iç ağ IP adresiyle değiştirin. Değiştirilmezse Postgres
# "invalid IP address" hatasıyla BAŞLAMAZ — bu bilinçlidir: kural unutulup
# veritabanı herkese açık kalmasın.
#
# Değişiklikten sonra:  docker compose restart db
# ===========================================================================

# TÜR   VERİTABANI  KULLANICI  ADRES                YÖNTEM
# Konteyner içinden (sağlık denetimi, yedekleme betiği) yerel soket:
local   all         all                             trust
host    all         all        127.0.0.1/32         scram-sha-256
host    all         all        ::1/128              scram-sha-256

# Yalnızca web sunucusu (uygulama ve göç adımı):
host    all         all        WEB_SUNUCU_IP/32     scram-sha-256

# Başka hiçbir adres kabul edilmez (eşleşmeyen bağlantı reddedilir).
