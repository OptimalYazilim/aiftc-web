# ============================================================================
# AIFTC WEB — ÜRETİM YIĞINI
# ============================================================================
# Kullanım (TEK sunucu; kurumun iki sunucusu için deploy/README.md):
#   cp .env.production.example .env.production   ve İÇİNİ DOLDURUN
#   E='--env-file .env.production'
#   docker compose $E up -d db
#   docker compose $E run --rm migrate                      # 1. göç
#   export DATABASE_URI_DERLEME='postgres://KULLANICI:PAROLA@127.0.0.1:5432/VERITABANI'
#   docker compose $E build app                             # 2. derleme (veritabanına bağlanır)
#   docker compose $E up -d                                 # 3. başlat
#
# SIRA ZORUNLU: derleme statik sayfaları veritabanından üretir; boş
# veritabanında göçten önce derlenirse düşer (ölçüldü — bkz. Dockerfile başı).
#
# Servisler tek bir özel ağdadır (`aiftc`). `app` ve `db` ana makinede
# YALNIZCA 127.0.0.1'e bağlanır; dışarıya ters vekil açılır.
#
# ---------------------------------------------------------------------------
# ÖNCEKİ SÜRÜMDEN FARKLAR — hepsi üretim gerekçeli
# ---------------------------------------------------------------------------
#   - Şifreler artık gömülü değil; `${VAR:?}` sözdizimi eksik değişkende
#     yığını BAŞLATMAZ. Eskiden `aiftc:aiftc` sabitti ve üretime öylece
#     çıkabilirdi.
#   - `db` dış arayüzlere port AÇMIYOR (yalnızca 127.0.0.1, derleme için);
#     `minio` hiç açmıyor. Eskiden 5432 dışarıdaydı: sunucuda güvenlik
#     duvarı yoksa veritabanı internete açıktı.
#   - Göçler ayrı ve tek seferlik bir servisle çalışır; `app` ancak göç
#     BAŞARIYLA bittikten sonra başlar.
#   - MinIO kovası `minio-init` ile otomatik oluşturulur; elle kurulum adımı
#     unutulduğunda yüklemeler sessizce başarısız oluyordu.
#
# NOT — GELİŞTİRME: günlük geliştirmede uygulama ana makinede `pnpm dev` ile
# çalıştırılır ve veritabanı olarak yönetilen Postgres (Neon) kullanılır.
# Bu dosya ÜRETİM içindir.
# ============================================================================

name: aiftc

services:
  # --- Veritabanı -----------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: aiftc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER tanimlanmali}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimlanmali}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB tanimlanmali}
      # C.UTF-8: Türkçe/Rusça karakterlerin doğru saklanması için. Sıralama
      # (collation) uygulama tarafında `localeCompare` ile yapılır.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [aiftc]
    # YALNIZCA 127.0.0.1: uygulama derlemesi (network: host) veritabanına
    # buradan ulaşır. Dış arayüzlere AÇILMAZ. İnceleme için:
    #   docker compose exec db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- Nesne depolama (S3 uyumlu) — İSTEĞE BAĞLI, `minio` profili ----------
  # ÖLÇÜLDÜ (2026-10-05): resmî `minio/minio` ve `minio/mc` imajları Docker
  # Hub'dan kaldırılmış ("object not found"); `latest` artık ÇEKİLEMİYOR.
  # Bu yüzden iki servis varsayılan olarak BAŞLAMAZ ve `up` onlar yüzünden
  # düşmez. Erişebildiğiniz bir imaj (kaynaktan derlenmiş ya da kurum aynası)
  # varsa MINIO_IMAGE / MINIO_MC_IMAGE ile verip profille açın:
  #   docker compose --env-file .env.production --profile minio up -d
  # Profilsiz (MEDIA_STORAGE_ADAPTER=local ya da kurumun harici S3'ü):
  #   docker compose --env-file .env.production up -d
  # İki sunuculu kurulum (dbaiftc + webaiftc) için bu dosya değil deploy/ kullanılır.
  minio:
    profiles: [minio]
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: aiftc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID tanimlanmali}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY tanimlanmali}
    volumes:
      - miniodata:/data
    networks: [aiftc]
    # Yönetim konsolu (9001) ve S3 ucu (9000) dışarı AÇILMAZ. Konsola erişim
    # gerekiyorsa SSH tüneli kullanın:
    #   ssh -L 9001:localhost:9001 sunucu
    # ve buraya geçici olarak `ports: ['127.0.0.1:9001:9001']` ekleyin.
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Kovayı bir kez oluşturur ve çıkar. Elle oluşturma adımı unutulduğunda
  # Payload yüklemeleri "NoSuchBucket" ile düşüyordu.
  #
  # KOVA KAPALI (`anonymous set none`). Önceki sürüm `download` yazıyordu:
  # kova herkese açık indirmeye açılıyor, dağıtım kontrol listesinin şartı
  # (`pnpm s3:denetle` → "KOVA HERKESE AÇIK" = canlıya geçilmez) kendi
  # compose dosyamızca bozuluyordu. Dosyalar her zaman Payload üzerinden,
  # erişim kuralıyla sunulur; kovanın kendisi kimseye açık olmamalı.
  minio-init:
    profiles: [minio]
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    container_name: aiftc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks: [aiftc]
    environment:
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET tanimlanmali}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    entrypoint: >
      /bin/sh -c "
      mc alias set aiftc http://minio:9000 \"$$S3_ACCESS_KEY_ID\" \"$$S3_SECRET_ACCESS_KEY\" &&
      mc mb --ignore-existing aiftc/\"$$S3_BUCKET\" &&
      mc anonymous set none aiftc/\"$$S3_BUCKET\" &&
      echo 'MinIO kovasi hazir.'
      "
    restart: 'no'

  # --- Veritabanı göçleri (tek seferlik) ------------------------------------
  # `app` bu servis BAŞARIYLA bitmeden başlamaz. Göç düşerse uygulama da
  # ayağa kalkmaz: eski şemayla çalışan bir sürüm, veriyi bozmaktan iyidir.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: aiftc-migrate
    depends_on:
      db:
        condition: service_healthy
    env_file: [.env.production]
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks: [aiftc]
    restart: 'no'

  # --- Uygulama -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # DERLEME ANINDA gömülür; `environment` altında vermek ETKİSİZDİR.
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?NEXT_PUBLIC_SERVER_URL tanimlanmali}
        NEXT_PUBLIC_LIBRARY_URL: ${NEXT_PUBLIC_LIBRARY_URL:-}
        NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-}
        NEXT_PUBLIC_ANALYTICS_DOMAIN: ${NEXT_PUBLIC_ANALYTICS_DOMAIN:-}
        NEXT_PUBLIC_ANALYTICS_SCRIPT_URL: ${NEXT_PUBLIC_ANALYTICS_SCRIPT_URL:-}
      # Derleme statik sayfalar için VERİTABANINA bağlanır (Dockerfile başı).
      # Derleme konteyneri compose ağında değildir; `db`ye ana makinenin
      # 127.0.0.1:5432'si üzerinden ulaşır (aşağıda db'nin `ports` satırı).
      network: host
      secrets: [database_uri]
    container_name: aiftc-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: [.env.production]
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    ports:
      # Yalnızca localhost'a bağlanır: dışarıya TLS sonlandıran ters vekil
      # (nginx/Traefik) açılır. Konteyneri doğrudan 0.0.0.0:3000'e açmak,
      # HSTS başlığı gönderen bir uygulamayı düz HTTP ile yayımlamak olurdu.
      - '127.0.0.1:3000:3000'
    volumes:
      # MEDIA_STORAGE_ADAPTER=local için kalıcılık. S3 kullanılıyorsa boş kalır
      # ama bağlı olması zarar vermez.
      #
      # `documents` cildi `public/` ALTINA BAĞLANMAZ. Orada durursa Next
      # dosyaları hiçbir kod çalıştırmadan servis eder ve Payload'ın erişim
      # kuralı devreye giremez (bkz. Dockerfile ve DocumentFiles.ts).
      - media:/app/public/media
      - documents:/app/private/documents
    networks: [aiftc]

networks:
  aiftc:
    driver: bridge

volumes:
  pgdata:
  miniodata:
  media:
  documents:

secrets:
  # Derleme anındaki veritabanı adresi (ana makineden görüldüğü hâliyle):
  #   DATABASE_URI_DERLEME=postgres://KULLANICI:PAROLA@127.0.0.1:5432/VERITABANI
  # Kabukta export edilmelidir (dosyanın başındaki kullanım sırası).
  database_uri:
    environment: DATABASE_URI_DERLEME
